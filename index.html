<script>

const $=id=>document.getElementById(id),p2=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);

let st={start:0,items:[],debts:[],fz:true,seen:[]},view='home',hk=1,mi=curMi(),bal={},byd={};

const monthlyOutgo=i=>i.a<0&&(spending(i)||(kind(i)==='debt'&&!isUnconfirmedPlan(i)));

// Kullanıcının geçmişte karttan ödendiğini doğruladığı tek kayıt: 13 Kasım 2026, X.

 const item=st.items.find(i=>i.id==='didkw94'&&i.d==='2026-11-13'&&i.t==='X'&&i.a===-10000&&!i.m&&!i.b);
 if(!item||!st.debts.some(d=>d.id==='zr'))return;
 try{localStorage.setItem('cep1_before_card_migration_'+Date.now(),JSON.stringify(st))}catch(e){return}
 item.m='card';item.b='zr';if(!item.c)item.c='Seyahat';save();
}
migrateKnownCardExpense();

const n=new Date(),todayLabel=n.getDate()+' '+MN[n.getMonth()]+' '+n.getFullYear();

function anchorAt(x,date){
 if(x.reconciledAt===date)return {balance:x.reconciledBalance,ids:x.reconciledItemIds};
 return x.reconcileHistory?.[date];
}
function closingDayAt(x,date){
 const rules=x.closingDays||[];
 for(let i=rules.length-1;i>=0;i--)if(rules[i].from<=date)return rules[i].day;
 return 0;
}
function setClosingDay(x,day,date){
 if(closingDayAt(x,date)===day)return;
 x.closingDays=(x.closingDays||[]).filter(rule=>rule.from!==date);
 x.closingDays.push({from:date,day});
 x.closingDays.sort((a,b)=>a.from.localeCompare(b.from));
}
function newCycle(){return {unpaid:0,fees:0,accrued:0,due:""}}
function debtDay(x,date,opening,activity,cycle,entriesForDay,afterPayment){
 let balance=opening;
 let interest=0;
 if(st.fz && cycle.due)cycle.accrued+=cycle.unpaid*(+x.r||0)/3000;
 const anchor=anchorAt(x,date);
 const entries=(entriesForDay||byd[date]||[]).filter(i=>i.b===x.id&&i.a<0&&!isUnconfirmedPlan(i));
 const captured=i=>!Array.isArray(anchor?.ids)||anchor.ids.includes(i.id);
 function apply(i){
  if(kind(i)==='card'){balance-=i.a;activity.purchases=(activity.purchases||0)-i.a}
  if(kind(i)==='debt'){
   const amount=Math.min(balance,-i.a);
   cycle.minimumLeft=Math.max(0,roundMoney((cycle.minimumLeft||0)-amount));
   const feesPaid=Math.min(cycle.fees,amount);
   cycle.fees-=feesPaid;
   cycle.unpaid=Math.max(0,cycle.unpaid-(amount-feesPaid));
   balance-=amount;if(afterPayment)afterPayment(i,roundMoney(balance));activity.payments=(activity.payments||0)+amount;
  }
 }
 entries.filter(captured).forEach(apply);
 if(anchor){
  activity.reconcile=(activity.reconcile||0)+anchor.balance-balance;
  balance=+anchor.balance;
  cycle.fees=Math.min(balance,cycle.fees);
  cycle.unpaid=Math.min(cycle.unpaid,balance-cycle.fees);
  entries.filter(i=>!captured(i)).forEach(apply);
 }
 if(date<=cycle.due && cycle.unpaid<=0.005)cycle.accrued=0;
 const day=closingDayAt(x,date);
 if(day && cycle.lastMonth!==date.slice(0,7) && Number(date.slice(8))===Math.min(day,dim(+date.slice(0,4),+date.slice(5,7)))){
  cycle.lastMonth=date.slice(0,7);
  // An end-of-day bank balance already includes that day's posted charges.
  if(st.fz&&!anchor)interest=roundMoney(cycle.accrued);
  cycle.accrued=0;
  let [year,month]=date.split('-').map(Number);
  const dueDay=Math.min(31,Math.max(1,+x.dueDay||6));
  if(debtDate(year,month,dueDay)<=date)month++;
  if(month>12){year++;month=1}
  cycle.due=debtDate(year,month,dueDay);
  cycle.unpaid=Math.max(0,roundMoney(balance-cycle.fees));
  balance+=interest;cycle.fees+=interest;
  cycle.minimumLeft=roundMoney(balance*.2);
 }
 activity.interest=(activity.interest||0)+interest;
 return roundMoney(balance);
}
function paymentInfo(item){
 if(!item||kind(item)!=='debt'||isUnconfirmedPlan(item))return '';
 const debt=st.debts.find(x=>x.id===item.b);
 if(!debt)return '';
 let history=paymentHistory.get(debt.id);
 if(!history){
  history={next:S,balance:Math.max(0,+debt.p||0),cycle:newCycle(),amounts:new Map()};
  paymentHistory.set(debt.id,history);
 }
 while(history.next<=item.d && history.next<=E){
  history.balance=debtDay(debt,history.next,history.balance,{},history.cycle,undefined,
   (entry,amount)=>history.amounts.set(entry.id,amount));
  history.next=nx(history.next);
 }
 if(!history.amounts.has(item.id))return '';
 const label=item.d>tdy()?'Ödeme sonrası tahmini kalan borç':'Ödeme sonrası kalan borç';
 return '<small class="payment-balance">'+label+' · '+f(history.amounts.get(item.id))+' ₺</small>';
}

 let balance=Math.max(0,+x.p||0);

}

function debtSchedule(x,choices){
 // Borç paneli ve takvimle AYNI tarihsel faiz modelini kullanır:
 const cycle=newCycle();

 const day=Math.min(31,Math.max(1,+x.dueDay||6));

  let interest=0,purchases=0,extraPayments=0;
  const activity={};
  for(let d=nx(from);d<date;d=nx(d))c=debtDay(x,d,c,activity,cycle);
  extraPayments=activity.payments||0;
  const entries=byd[date]||[];
  const recorded=entries.filter(i=>i.b===x.id&&kind(i)==='debt'&&i.a<0);
  const manual=recorded.some(i=>!i.autoDebt),recordedAmount=recorded.reduce((sum,i)=>sum-i.a,0);
  const other=entries.filter(i=>!recorded.includes(i));
  const beforePayment=roundMoney(c+other.filter(i=>i.b===x.id&&kind(i)==='card'&&i.a<0).reduce((sum,i)=>sum-i.a,0));
  const min=closingDayAt(x,date)?Math.min(beforePayment,cycle.due===date?cycle.minimumLeft||0:0):roundMoney(beforePayment*.2);
  const suggested=recorded.length?recordedAmount:x.planOverrides?.[date]??min;
  const picked=choices&&Object.hasOwn(choices,date);
  const target=picked?(choices[date]??suggested):recordedAmount;
  const pay=Math.min(beforePayment,Math.max(0,roundMoney(target)));
  const projected=picked?[...other,{b:x.id,m:'debt',a:-pay,d:date}]:entries;
  c=debtDay(x,date,c,activity,cycle,projected);
  interest=activity.interest||0;purchases=activity.purchases||0;
  const opening=roundMoney(c+pay);
  out.push({date,opening,min,pay,suggested,interest:roundMoney(interest),purchases:roundMoney(purchases),extraPayments:roundMoney(extraPayments),closing:c,manual,recorded:recordedAmount});
  from=date;m++;if(m>12){m=1;y++}
 }
 return out;
}

function cashOutlook(today) {
 const nextIncome = st.items.reduce((soonest, item) => {
  if (kind(item)!=='income' || item.d<=today || item.d>E) return soonest;
  return !soonest || item.d<soonest ? item.d : soonest;
 }, '');
 const monthEnd = today.slice(0,8)+dim(+today.slice(0,4),+today.slice(5,7));
 const end = nextIncome ? pv(nextIncome) : monthEnd;
 let lowestDay=today, firstNegative='';
 const changes=[];
 for (let date=today; date<=end; date=nx(date)) {
  const amount=roundMoney(bal[date]);
  if (amount<roundMoney(bal[lowestDay])) lowestDay=date;
  if (amount<0 && !firstNegative) firstNegative=date;
  if (date===today || amount!==roundMoney(bal[pv(date)])) changes.push(date);
 }
 return {today,end,nextIncome,lowestDay,firstNegative,changes};
}

const foldSearch=value=>String(value??'').toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replaceAll('ı','i');

function matchingItems(state,today) {

 <div class="panel"><label for="query">Açıklama, kategori, kart veya tutar</label>
 <input id="query" type="search" value="${att(searchState.query)}" placeholder="Örn. market veya 1.500">
 <div class="search-filters"><label>Dönem<select id="period"><option value="past">Bugün ve geçmiş</option><option value="future">Gelecek</option><option value="all">Tüm tarihler</option><option value="pending">Onay bekleyen</option></select></label>
 <label>İşlem türü<select id="method"><option value="">Tümü</option>${Object.entries(methodNames).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label></div></div>
 <p id="matchCount" role="status" class="home-muted"></p><div id="matches"></div>`;
}

function bindSearch() {
 const results=$('matches');
 function show() {
  const matches=matchingItems(searchState,tdy());
  $('matchCount').textContent=matches.length?matches.length+' işlem bulundu.':'Bu seçimle eşleşen işlem yok.';
  const rows=matches.slice(0,searchState.limit).map(i=>`<button class="list-entry" data-match="${att(i.id)}">
   <span><b>${esc(i.t)}</b><small>${fullDay(i.d)} · ${methodNames[kind(i)]}${isUnconfirmedPlan(i)?' · Onay bekliyor':''}</small>${paymentInfo(i)}</span>
   <strong class="${i.a<0?'neg':'pos'}">${sg(i.a)} ₺</strong></button>`);
  results.innerHTML=(rows.length?'<div class="panel">'+rows.join('')+'</div>':'')+
    (matches.length>rows.length?'<button class="btn w" id="moreMatches">Daha fazla göster</button>':'');
  if($('moreMatches'))$('moreMatches').onclick=()=>{searchState.limit+=40;show()};
 }
 results.onclick=e=>{
  const button=e.target.closest('[data-match]');
  if(button)form(st.items.find(i=>i.id===button.dataset.match));
 };
 for(const key of ['query','period','method']){
  const input=$(key);
  input.value=searchState[key];
  input.addEventListener(key==='query'?'input':'change',()=>{
   searchState[key]=input.value;searchState.limit=40;show();
  });
 }
 $('exitSearch').onclick=()=>{mi=searchOrigin.month;changeView(searchOrigin.view)};
 show();
}
let searchOrigin={view:'home',month:curMi()};
function openSearch(){
 if(view!=='search')searchOrigin={view,month:mi};
 changeView('search');$('query').focus();
}

function homeView(){const T=tdy(),m=MS[mi],[y,mo]=m.split('-').map(Number),fs=m+'-01'<S?S:m+'-01',z=m+'-'+p2(dim(y,mo)),fe=z>E?E:z;
const monthly=st.items.filter(i=>i.d>=fs&&i.d<=fe),income=monthly.filter(i=>kind(i)==='income').reduce((s,i)=>s+i.a,0),expense=sumOutgo(monthly),purchases=monthly.filter(i=>spending(i)&&i.a<0).reduce((s,i)=>s-i.a,0),debtPayments=monthly.filter(i=>kind(i)==='debt'&&i.a<0&&!isUnconfirmedPlan(i)).reduce((s,i)=>s-i.a,0);
const upcoming=st.items.filter(i=>i.d>T&&i.d<=E&&i.a<0&&kind(i)!=='card'&&kind(i)!=='transfer'&&kind(i)!=='adjustment').sort((a,b)=>a.d.localeCompare(b.d)).slice(0,4);
const recent=st.items.filter(i=>i.d<=T&&i.d>=S).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,3);
const itemIcon=i=>/kart|kredi|borç|avans/i.test(i.t)?'💳':/yurt|kira|ev/i.test(i.t)?'⌂':/yemek|market|kahve/i.test(i.t)?'◉':'↗';
const payRow=i=>`<div class="home-pay" data-e="${i.id}"><div class="home-pay-icon">${itemIcon(i)}</div><div class="home-pay-info"><b>${esc(i.t)}</b><small>${dl(i.d)} · ${esc(guess(i))}</small>${paymentInfo(i)}</div><span class="home-pay-amount ${i.a<0?'neg':'pos'}">${sg(i.a)} ₺</span></div>`;
return `${st.items.length===0?`<div class="panel" style="padding:20px;border:1px solid var(--bd)"><b style="font-size:18px">Cebim'e hoş geldin</b><p class="home-muted">Önce başlangıç paranı ayarlardan gir, sonra gelir ve giderlerini ekle. Verilerin bu cihazda saklanır.</p><button class="btn p" id="welcomeStart">Başlangıç bakiyemi ayarla</button></div>`:''}${st.items.length||st.start?outlookPanel(cashOutlook(T)):''}<div class="home-section-title">Yaklaşan ödemeler <button id="allDay">Takvimi gör →</button></div><div class="panel">${upcoming.length?upcoming.map(payRow).join(''):'<div class="home-muted">Planlanan yaklaşan ödeme bulunmuyor.</div>'}</div>
<div class="home-section-title">Bu ay <button id="allRep">Detaylı rapor →</button></div><div class="panel"><div class="home-eyebrow">${MN[mo-1]} ${y} · Aylık özet</div><div class="home-month"><div class="jump" data-go="income"><small>Gelirler ↗</small><b class="pos">+${f(income)} ₺</b></div><div class="jump" data-go="expense"><small>Giderler ↗</small><b class="neg">−${f(expense)} ₺</b></div></div><div class="home-foot">Giderler: ${f(purchases)} ₺ alışveriş + ${f(debtPayments)} ₺ kart/borç ödemesi. Ödemeler, önceki alışverişlerle çakışabilir. Gerçekleşen ve geleceğe planlanan işlemler birlikte gösterilir.</div></div>
<div class="home-section-title">Son kayıtlar <button id="allDay2">İşlem ara</button></div><div class="panel">${recent.length?recent.map(payRow).join(''):'<div class="home-muted">Henüz işlem bulunmuyor. Alttaki + düğmesinden ekleyebilirsin.</div>'}</div>`}
function cardHistorySheet(){
 const cards=st.debts.filter(x=>/kart/i.test(x.n)&&!/avans/i.test(x.n));
 if(!cards.length){toast('Önce bir kredi kartı borcu eklemelisin');return}
 const candidates=st.items.filter(i=>i.a<0&&kind(i)==='cash'&&i.d<=tdy()).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,100);
 const options=cards.map(x=>'<option value="'+att(x.id)+'">'+esc(x.n)+'</option>').join('');
 sheet('<h3>Geçmiş kart harcamalarını ayır</h3><p class="note">Nakit harcaması olarak kayıtlı olup aslında kredi kartıyla aldığın ürün/hizmetleri işaretle. Harcama kendi tarihinde gider olarak KALIR; nakit bakiyenden düşmez, seçtiğin kartın borcuna eklenir. Banka borcunu bu alışveriş tarihinden sonra eşitlediysen geçmiş alışveriş güncel borçtan ikinci kez düşülmez veya eklenmez.</p><label>Hangi kredi kartıyla?</label><select id="cardMigrationTarget">'+options+'</select><div id="cardOldList" style="max-height:50vh;overflow:auto">'+(candidates.length?candidates.map(i=>'<label class="panel" style="display:flex;align-items:center;gap:12px;margin:7px 0"><input type="checkbox" data-card-old="'+att(i.id)+'" style="width:22px;height:22px;flex:none"><span><b>'+esc(i.t)+'</b><br><small>'+dl(i.d)+' · '+f(-i.a)+' ₺ · '+esc(guess(i))+'</small></span></label>').join(''):'<p class="note">Kart olarak işaretlenebilecek eski nakit gideri bulunamadı.</p>')+'</div><button class="btn p" id="applyCardOld">Seçilenleri kart harcaması yap</button>',()=>{
 $('applyCardOld').onclick=()=>{
  const selected=[...document.querySelectorAll('[data-card-old]:checked')].map(e=>e.dataset.cardOld);
  if(!selected.length){toast('Önce harcama seç');return}
  const target=$('cardMigrationTarget').value;
  if(!st.debts.some(x=>x.id===target)){toast('Kart seç');return}
  try{localStorage.setItem('cep1_before_card_backfill_'+Date.now(),JSON.stringify(st))}catch(e){toast('Kurtarma yedeği oluşturulamadı, işlem yapılmadı');return}
  let count=0;
  st.items.forEach(i=>{if(selected.includes(i.id)&&i.a<0&&kind(i)==='cash'){i.m='card';i.b=target;count++}});
  save();close();render();toast(count+' eski harcama karta taşındı');
 };
 });
}
function moneyPage(page){
 const inc=page==='income',m=MS[mi],T=tdy(),[y,mo]=m.split('-').map(Number),fs=m+'-01'<S?S:m+'-01',fe=m+'-'+p2(dim(y,mo))>E?E:m+'-'+p2(dim(y,mo));
 const month=st.items.filter(i=>i.d>=fs&&i.d<=fe);
 const spent=month.filter(i=>spending(i)&&i.a<0).sort((a,b)=>a.d.localeCompare(b.d));
 const debtPaid=month.filter(i=>kind(i)==='debt'&&i.a<0&&!isUnconfirmedPlan(i)).sort((a,b)=>a.d.localeCompare(b.d));
 const incomes=month.filter(i=>kind(i)==='income').sort((a,b)=>a.d.localeCompare(b.d));
 const items=inc?incomes:spent;
 const purchaseTotal=spent.reduce((n,i)=>n-i.a,0);
 const total=inc?incomes.reduce((n,i)=>n+i.a,0):purchaseTotal+debtPaid.reduce((n,i)=>n-i.a,0);
 const done=inc?incomes.filter(i=>i.d<=T).reduce((n,i)=>n+i.a,0):spent.filter(i=>i.d<=T).reduce((n,i)=>n-i.a,0)+debtPaid.filter(i=>i.d<=T).reduce((n,i)=>n-i.a,0);
 const cashSpent=spent.filter(i=>kind(i)==='cash').reduce((n,i)=>n-i.a,0);
 const cardSpent=spent.filter(i=>kind(i)==='card').reduce((n,i)=>n-i.a,0);
 const payments=debtPaid.reduce((n,i)=>n-i.a,0);
 const cashOut=cashSpent+payments;
 const cats=Object.create(null);items.forEach(i=>{const c=guess(i);(cats[c]??=[]).push(i)});
 const row=i=>`<div class="row tappable" data-e="${i.id}"><span><b>${esc(i.t)}</b><br><small>${dl(i.d)} · ${kind(i)==='card'?'💳 '+esc(dn(i.b)||'Kart'):kind(i)==='debt'?(isUnconfirmedPlan(i)?'⏳ Ödeme onayı bekliyor':i.d>T?'⏳ Planlanan ödeme':'✓ Kayıtlı ödeme')+' · '+esc(dn(i.b)||'Borç'):i.d>T?'Planlandı':'Kayıtlı'}</small>${paymentInfo(i)}</span><b class="${inc?'pos':'neg'}">${sg(i.a)} ₺</b></div>`;
 const catHtml=Object.entries(cats).sort((a,b)=>b[1].reduce((n,i)=>n+Math.abs(i.a),0)-a[1].reduce((n,i)=>n+Math.abs(i.a),0)).map(([name,rows])=>`<details class="cat-card"><summary><span>${esc(name)}<small>${rows.length} işlem</small></span><strong class="${inc?'pos':'neg'}">${f(rows.reduce((n,i)=>n+Math.abs(i.a),0))} ₺</strong></summary>${rows.map(row).join('')}</details>`).join('');
 return `<div class="page-head"><span class="home-eyebrow">PARA AKIŞI</span><h2>${inc?'Gelirler':'Giderler'}</h2><p>${inc?'Kazançlarını ve beklediğin ödemeleri takip et.':'Kart harcamalarını alışveriş yaptığın tarihte, kart ödemelerini para hesabından çıktığı tarihte gösteriyoruz.'}</p></div>${nav()}
 <div class="panel money-total"><small>${MN[mo-1]} ${y} · ${inc?'Toplam gelir':'TOPLAM AYLIK GİDER (alışveriş + kart/borç ödemesi)'}</small><div class="big ${inc?'pos':'neg'}">${inc?'+':'−'}${f(total)} ₺</div><div class="money-split"><span>Bugüne kadar tarihli <b>${f(done)} ₺</b></span><span>Gelecek tarihli <b>${f(total-done)} ₺</b></span></div>
 ${!inc?'<details class="month-ledger"><summary>Alışveriş ve ödeme dağılımı</summary><div class="row" style="margin-top:10px;font-weight:600"><span>Alışveriş toplamı (nakit + kart)</span><b>'+f(purchaseTotal)+' ₺</b></div><div class="row"><span>💳 Kartla alışveriş</span><b>'+f(cardSpent)+' ₺</b></div><div class="row"><span>🏦 Nakit / banka ile alışveriş</span><b>'+f(cashSpent)+' ₺</b></div><div class="row" style="font-weight:600"><span>💸 Kart / borç ödemesi</span><b>'+f(payments)+' ₺</b></div><div class="row" style="background:var(--bg);border-radius:12px;padding:11px;margin-top:6px"><span>Toplam nakit çıkışı <small style="display:block">Nakit harcamalar + borç ödemeleri</small></span><b class="neg">'+f(cashOut)+' ₺</b></div><div class="note" style="margin-top:9px">Bu üstteki gider toplamı aylık hareketlerin toplamıdır: önceki alışverişin kart ödemesi de ayrı bir hareket olarak dahildir. Tekil tüketim tutarı için alışveriş toplamına bak.</div></details>':''}
 ${inc?'':'<details class="month-ledger"><summary>Toplama giren işlemler ('+month.filter(monthlyOutgo).length+')</summary>'+month.filter(monthlyOutgo).sort((a,b)=>a.d.localeCompare(b.d)).map(row).join('')+'</details>'}
 </div>
 ${!inc?'<details class="cat-card"><summary>Geçmiş kayıtları düzenle</summary><button class="btn w" id="cardBackfill">Geçmiş kart harcamalarını düzelt</button></details>':''}
 <div class="home-section-title">${inc?'Gelir kaynakları':'Alışveriş / gider kategorileri'}</div>${catHtml||'<div class="panel home-muted">Bu ay henüz kayıt yok.</div>'}
 <button class="btn p" id="moneyAdd">+ ${inc?'Gelir':'Gider'} ekle</button>`;
}
function changeView(v){view=v;render();window.scrollTo(0,0)}
function render(){if(view==='home')mi=curMi();document.getElementById("preview-warning")?.remove();build();hero();banner();
document.querySelectorAll('#tb [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
$('hero').style.display=view==='home'?'block':'none';
const m=$('main');m.innerHTML=view==='home'?homeView():view==='income'?moneyPage('income'):view==='expense'?moneyPage('expense'):view==='day'?dayView():view==='debt'?debtView():view==='search'?searchPage():repView();
if($('bk1')){$('bk1').onclick=()=>{if(mi>0){mi--;render()}};$('bk2').onclick=()=>{if(mi<MS.length-1){mi++;render()}};$('bt').onclick=()=>{mi=curMi();render()}}
m.querySelectorAll('[data-d]').forEach(r=>r.onclick=()=>daySheet(r.dataset.d));
m.querySelectorAll('[data-e]').forEach(r=>r.onclick=()=>form(st.items.find(i=>i.id===r.dataset.e)));
m.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{hk=+b.dataset.h;render()});
m.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>changeView(el.dataset.go));
if($('moneyAdd'))$('moneyAdd').onclick=()=>form(null,tdy(),view==='income'?1:-1);


if($('cardBackfill'))$('cardBackfill').onclick=cardHistorySheet;

if($('welcomeStart'))$('welcomeStart').onclick=setSheet;
if($('allDay'))$('allDay').onclick=()=>changeView('day');
if($('allDay2'))$('allDay2').onclick=()=>{Object.assign(searchState,{query:'',method:'',period:'past',limit:40});openSearch()};
if(view==='debt'&&st.items.some(isUnconfirmedPlan))m.insertAdjacentHTML('afterbegin','<button class="btn w" id="pendingReview">Onay bekleyen ödemeleri gör</button>');
if($('pendingReview'))$('pendingReview').onclick=()=>{
 Object.assign(searchState,{query:'',method:'',period:'pending',limit:40});
 openSearch();
};
if($('simulate'))$('simulate').onclick=simulateExpense;
if(view==='search')bindSearch();
if($('allRep'))$('allRep').onclick=()=>changeView('rep');
if($('ha'))$('ha').onclick=()=>{const q=MS[mi]===tdy().slice(0,7)?tdy():(MS[mi]+'-01'<S?S:MS[mi]+'-01');form(null,q,hk)};
if(view==='day'&&!window.__sc){const r=m.querySelector('.today');if(r){window.__sc=1;r.scrollIntoView({block:'start'})}}
if(view==='debt'){m.insertAdjacentHTML('afterbegin','<div class="tools-head"><h2>Borçlar</h2><button class="btn" id="payDebt">Ödeme ekle</button></div>');$('payDebt').onclick=()=>st.debts.length?form(null,tdy(),-1,'debt'):toast('Önce bir borç ekle');m.querySelectorAll('[data-plan-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();debtPlanSheet(b.dataset.planOpen)});m.querySelectorAll('[data-reconcile]').forEach(b=>b.onclick=e=>{e.stopPropagation();debtReconcile(b.dataset.reconcile)});m.querySelectorAll('[data-x]').forEach(r=>r.onclick=()=>debtSheet(r.dataset.x));$('fz').onchange=()=>{st.fz=$('fz').checked;save();render()};
$('nd').onclick=()=>{const id=uid();st.debts.push({id,n:'Yeni borç',p:0,r:4,dueDay:6,planOverrides:{}});save();render();debtSheet(id)};
/* kaldırılan eski otomatik ödeme düğmesi */}
if(view==='rep'){m.insertAdjacentHTML('afterbegin','<button class="btn" id="backHome" style="margin-bottom:14px">‹ Ana sayfa</button>');$('backHome').onclick=()=>changeView('home')}
if(view==='rep'&&!st.seen.includes(MS[mi])){st.seen.push(MS[mi]);save();banner()}}
$('fab').onclick=()=>form(null,tdy());$('gs').onclick=setSheet;$('searchAll').onclick=openSearch;
document.querySelectorAll('#tb [data-v]').forEach(b=>b.onclick=()=>changeView(b.dataset.v));
render();
if('serviceWorker' in navigator && window.isSecureContext && location.protocol!=='file:'){
 navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready)
 .then(()=>{$('offlineState').textContent='Çevrimdışı kullanıma hazır'})
 .catch(()=>{$('offlineState').textContent='Çevrimdışı açılış hazırlanamadı'});
}
</script></body></html>
