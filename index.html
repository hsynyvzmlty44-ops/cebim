<script>

const $=id=>document.getElementById(id),p2=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const D=s=>new Date(s+'T00:00:00Z'),add=(d,n)=>{const t=D(d);t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)},nx=d=>add(d,1),pv=d=>add(d,-1);

const f=n=>{const v=Math.round((+n||0)*100)/100;return v.toLocaleString('tr-TR',{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2})},esc=s=>{const e=document.createElement('div');e.textContent=s;return e.innerHTML},att=s=>esc(s).replace(/"/g,'&quot;');

let st={start:0,items:[],debts:[],fz:true,seen:[]},view='home',hk=1,mi=curMi(),bal={},byd={};

const spending=i=>kind(i)==='cash'||kind(i)==='card';

const monthlyOutgo=i=>i.a<0&&(spending(i)||(kind(i)==='debt'&&!isUnconfirmedPlan(i)));
const sumOutgo=items=>items.filter(monthlyOutgo).reduce((sum,i)=>sum-i.a,0);
const roundMoney=n=>Math.round((+n||0)*100)/100;

function migrateKnownCardExpense(){
 const item=st.items.find(i=>i.id==='didkw94'&&i.d==='2026-11-13'&&i.t==='X'&&i.a===-10000&&!i.m&&!i.b);
 if(!item||!st.debts.some(d=>d.id==='zr'))return;
 try{localStorage.setItem('cep1_before_card_migration_'+Date.now(),JSON.stringify(st))}catch(e){return}
 item.m='card';item.b='zr';if(!item.c)item.c='Seyahat';save();
}
migrateKnownCardExpense();
function build(){byd={};bal={};st.items.forEach(i=>{if(i.d>=S&&i.d<=E)(byd[i.d]=byd[i.d]||[]).push(i)});let b=+st.start||0;for(let d=S;d<=E;d=nx(d)){(byd[d]||[]).forEach(i=>b+=cashDelta(i));bal[d]=b}}

function dates(d,r,en){if(r==='0')return[d];const o=[];if(r==='w'){for(let x=d;x<=en;x=add(x,7))o.push(x)}else{const[y0,m0,dd]=d.split('-').map(Number);for(let k=0;;k++){const t=y0*12+m0-1+k,y=Math.floor(t/12),m=t%12+1,x=y+'-'+p2(m)+'-'+p2(Math.min(dd,dim(y,m)));if(x>en)break;o.push(x)}}return o.length?o:[d]}
function hero(){const t=tdy(),monthEnd=t.slice(0,8)+dim(+t.slice(0,4),+t.slice(5,7)),future=st.items.filter(i=>i.d>t&&i.d<=monthEnd),futureOut=future.filter(i=>i.a<0&&kind(i)!=='card'&&kind(i)!=='transfer'&&kind(i)!=='adjustment').reduce((s,i)=>s-i.a,0),futureIn=future.filter(i=>kind(i)==='income').reduce((s,i)=>s+i.a,0);
const n=new Date(),todayLabel=n.getDate()+' '+MN[n.getMonth()]+' '+n.getFullYear();
$('hero').innerHTML=`<div class="home-date">${todayLabel} · ${WF[n.getDay()]}</div><div class="hero"><div class="home-eyebrow">Bugün cebimde</div><div class="big ${bal[t]<0?'neg':''}">${f(bal[t])} ₺</div><div class="home-muted">Kaydettiğin işlemlere göre. Gerçek paran farklı olabilir.</div><div class="home-summary"><div><span>Ay sonuna kadar gelir</span><b class="pos">+${f(futureIn)} ₺</b></div><div><span>Ay sonuna kadar ödenecek</span><b class="neg">−${f(futureOut)} ₺</b></div></div></div><div class="home-safe"><div><div class="home-eyebrow">Ay sonunda tahmini kalan</div><strong class="${bal[monthEnd]<0?'neg':''}">${f(bal[monthEnd])} ₺</strong><small>${dl(monthEnd)} için kayıtlı plana göre</small></div><button class="btn" id="rbo">Eşitle ↗</button></div>`;
$('rbo').onclick=realSheet}
function banner(){const t=tdy();let p=null;MS.forEach(m=>{const[y,mo]=m.split('-').map(Number),z=m+'-'+p2(dim(y,mo));if(z<=t&&z<=E&&!st.seen.includes(m))p=m});
$('bn').innerHTML=p&&view==='home'?`<div class="panel" style="border-color:var(--ac)"><b>📋 ${MN[+p.slice(5)-1]} ayı raporu hazır</b> <button class="btn" id="bg" style="margin-left:8px">Gör</button></div>`:'';if($('bg'))$('bg').onclick=()=>{mi=MS.indexOf(p);view='rep';render()}}
function nav(){const[y,m]=MS[mi].split('-').map(Number);return`<div class="nv"><button class="btn" id="bk1">‹</button><b>${MN[m-1]} ${y}</b><button class="btn" id="bk2">›</button><button class="btn" id="bt">Bugün</button></div>`}

function anchorAt(x,date){
 if(x.reconciledAt===date)return {balance:x.reconciledBalance,ids:x.reconciledItemIds};
 return x.reconcileHistory?.[date];
}
function debtDay(x,date,opening,activity={}){
 let balance=opening;
 const interest=date>S&&date.endsWith('-01')&&st.fz?roundMoney(balance*(+x.r||0)/100):0;
 balance+=interest;
 activity.interest=(activity.interest||0)+interest;
 const anchor=anchorAt(x,date);
 const entries=(byd[date]||[]).filter(i=>i.b===x.id&&i.a<0&&!isUnconfirmedPlan(i));
 const captured=i=>!Array.isArray(anchor?.ids)||anchor.ids.includes(i.id);
 function apply(i){
  if(kind(i)==='card'){balance-=i.a;activity.purchases=(activity.purchases||0)-i.a}
  if(kind(i)==='debt'){
   const amount=Math.min(balance,-i.a);
   balance-=amount;activity.payments=(activity.payments||0)+amount;
  }
 }
 entries.filter(captured).forEach(apply);
 if(anchor){
  activity.reconcile=(activity.reconcile||0)+anchor.balance-balance;
  balance=+anchor.balance;
  entries.filter(i=>!captured(i)).forEach(apply);
 }
 return roundMoney(balance);
}
function debtBalanceAt(x,upto){
 let balance=Math.max(0,+x.p||0);
 for(let d=S;d<=upto;d=nx(d))balance=debtDay(x,d,balance);
 return balance;
}

const debtDate=(y,m,day)=>y+'-'+p2(m)+'-'+p2(Math.min(day,new Date(y,m,0).getDate()));
function debtSchedule(x,choices){
 // Borç paneli ve takvimle AYNI tarihsel faiz modelini kullanır:
 // ayın 1'inde faiz, alışveriş tarihinde kart borcu, ödeme tarihinde nakit çıkışı.
 let c=debtBalanceAt(x,tdy()),out=[],now=new Date(tdy()+'T12:00:00');
 const day=Math.min(28,Math.max(1,+x.dueDay||6));
 let y=now.getFullYear(),m=now.getMonth()+1,from=tdy();
 if(debtDate(y,m,day)<=from){m++;if(m>12){m=1;y++}}
 for(let k=0;k<36;k++){
  const date=debtDate(y,m,day);if(date>E)break;
  let interest=0,purchases=0,extraPayments=0;
  for(let d=nx(from);d<=date;d=nx(d)){
   if(d>S&&d.slice(8)==='01'&&st.fz){
    const addInterest=roundMoney(c*(+x.r||0)/100);
    c+=addInterest;interest+=addInterest;
   }
   (byd[d]||[]).forEach(i=>{
    if(i.b!==x.id||isUnconfirmedPlan(i))return;
    if(kind(i)==='card'&&i.a<0){c-=i.a;purchases-=i.a}
    else if(kind(i)==='debt'&&i.a<0&&d!==date){
     const amt=Math.min(c,-i.a);c-=amt;extraPayments+=amt;
    }
   });
  }
  const opening=roundMoney(c),min=roundMoney(Math.min(c,c*.2));
  const recorded=st.items.filter(i=>i.b===x.id&&kind(i)==='debt'&&i.a<0&&i.d===date);
  const manual=recorded.some(i=>!i.autoDebt),recordedAmount=recorded.reduce((sum,i)=>sum-i.a,0);
  const override=x.planOverrides&&x.planOverrides[date];
  const suggested=recorded.length?recordedAmount:override!==undefined?+override:min;
  const picked=choices&&Object.hasOwn(choices,date);
  const desired=picked?(choices[date]??suggested):recordedAmount;
  const pay=Math.min(opening,Math.max(0,roundMoney(desired)));
  c=roundMoney(Math.max(0,c-pay));
  out.push({date,opening,min,pay,suggested,interest:roundMoney(interest),purchases:roundMoney(purchases),extraPayments:roundMoney(extraPayments),closing:c,manual,recorded:recordedAmount});
  from=date;m++;if(m>12){m=1;y++}
 }
 return out;
}
